<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Harness</title>
    <style>
      :root {
        color-scheme: light;
        /* DeepSeek Harness 调色板（见 THEME.md） */
        --bg: #ffffff;
        --text: #1f2937;
        --text-secondary: #6b7280;
        --border: #e5e7eb;
        --card: #ffffff;
        --accent: #3b6cf6;
        --accent-soft: #e5edff;
        --accent-gradient: linear-gradient(135deg, #4f7cff 0%, #8b5cf6 100%);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        /* 白色底 + 中央柔和蓝/紫渐变光晕 */
        background:
          radial-gradient(1100px 560px at 50% -10%, #eef2ff 0%, rgba(238, 242, 255, 0) 60%),
          radial-gradient(900px 520px at 82% 18%, #f5f3ff 0%, rgba(245, 243, 255, 0) 55%),
          var(--bg);
        color: var(--text);
        font-family: -apple-system, system-ui, "Segoe UI", Roboto, "PingFang SC",
          "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: min(560px, 92vw);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 30px 32px;
        box-shadow: 0 12px 40px rgba(31, 41, 55, 0.1);
        animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes cardIn {
        from { opacity: 0; transform: translateY(8px) scale(0.99); }
        to   { opacity: 1; transform: none; }
      }

      /* ---------- 加载视图 ---------- */
      .loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 16px;
        padding: 10px 0 4px;
      }
      .orb-wrap {
        position: relative;
        width: 76px;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .halo {
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(79, 124, 255, 0.28), rgba(139, 92, 246, 0.12) 55%, transparent 72%);
        animation: pulse 2.6s ease-in-out infinite;
      }
      .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 0deg,
          rgba(79, 124, 255, 0) 0%,
          #4f7cff 35%,
          #8b5cf6 70%,
          rgba(139, 92, 246, 0) 100%);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
                mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
        animation: spin 1.15s linear infinite;
      }
      .orb {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: var(--accent-gradient);
        box-shadow: 0 8px 22px rgba(79, 124, 255, 0.4);
        animation: breathe 2.6s ease-in-out infinite;
      }
      .title {
        margin: 4px 0 0;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--text);
        animation: fadeUp 0.6s ease both 0.05s;
      }
      .status {
        margin: 0;
        font-size: 13px;
        color: var(--text-secondary);
        min-height: 18px;
        animation: fadeUp 0.6s ease both 0.12s;
      }
      .status .dots::after {
        content: "";
        animation: dots 1.4s steps(4, end) infinite;
      }
      .track {
        width: 200px;
        height: 4px;
        border-radius: 999px;
        background: var(--accent-soft);
        overflow: hidden;
        margin-top: 2px;
      }
      .track::after {
        content: "";
        display: block;
        height: 100%;
        width: 38%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #4f7cff, #8b5cf6, transparent);
        animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes spin   { to { transform: rotate(360deg); } }
      @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
      @keyframes pulse  { 0%, 100% { opacity: 0.55; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes slide  { 0% { transform: translateX(-130%); } 100% { transform: translateX(330%); } }
      @keyframes dots   { 0% { content: ""; } 25% { content: "·"; } 50% { content: "··"; } 75%, 100% { content: "···"; } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

      /* ---------- 详情视图（错误 / 引导） ---------- */
      .details { animation: fadeUp 0.45s ease both; }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 2px;
      }
      .brand .mark {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: var(--accent-gradient);
        box-shadow: 0 2px 8px rgba(79, 124, 255, 0.35);
      }
      .brand h1 {
        margin: 0;
        font-size: 20px;
        color: var(--text);
        letter-spacing: -0.01em;
      }
      .sub {
        margin: 8px 0 18px;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .state {
        font-size: 13px;
        font-weight: 600;
        padding: 6px 11px;
        border-radius: 9px;
        display: inline-block;
        margin-bottom: 14px;
      }
      .state.starting { background: #e5edff; color: #1e40af; }
      .state.ready { background: #dcfce7; color: #166534; }
      .state.error { background: #fee2e2; color: #b91c1c; }
      .state.missing-dsh { background: #fef3c7; color: #92400e; }
      .state.restarting { background: #f3e8ff; color: #6d28d9; }
      .msg {
        white-space: pre-wrap;
        font-size: 13px;
        line-height: 1.5;
        background: #f9fafb;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 12px 14px;
        margin: 0 0 16px;
        color: var(--text);
        word-break: break-all;
      }
      label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 6px; }
      input[type="text"] {
        width: 100%;
        padding: 9px 11px;
        background: #ffffff;
        border: 1px solid #d1d5db;
        border-radius: 9px;
        color: var(--text);
        font-size: 13px;
      }
      input[type="text"]::placeholder { color: #9ca3af; }
      input[type="text"]:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(59, 108, 246, 0.15);
      }
      button {
        margin-top: 12px;
        width: 100%;
        padding: 11px 12px;
        border: none;
        border-radius: 9px;
        background: var(--accent-gradient);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: filter 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 4px 14px rgba(79, 124, 255, 0.25);
      }
      button:hover { filter: brightness(1.05); }
      button:active { filter: brightness(0.97); }
      button:disabled {
        background: #e5e7eb;
        color: #9ca3af;
        box-shadow: none;
        cursor: default;
        filter: none;
      }
      .cands { margin: 12px 0 0; font-size: 12px; color: var(--text-secondary); }
      .cands code { color: #6d28d9; background: #f5f3ff; padding: 1px 5px; border-radius: 5px; }
      .hidden { display: none !important; }

      /* 尊重系统的「减少动态效果」偏好 */
      @media (prefers-reduced-motion: reduce) {
        *, *::after, *::before { animation: none !important; transition: none !important; }
        .ring { opacity: 0.5; }
        .halo { opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- 加载视图 -->
      <div id="loader" class="loader">
        <div class="orb-wrap">
          <span class="halo" aria-hidden="true"></span>
          <span class="ring" aria-hidden="true"></span>
          <span class="orb" aria-hidden="true"></span>
        </div>
        <h1 class="title">DeepSeek Harness</h1>
        <p class="status" id="statusText">正在启动本机 dsh web<span class="dots"></span></p>
        <div class="track" aria-hidden="true"></div>
      </div>

      <!-- 详情视图（错误 / 未找到 dsh 引导） -->
      <div id="details" class="details hidden">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <h1>DeepSeek Harness</h1>
        </div>
        <p class="sub">桌面启动器 · 加载本机 dsh web</p>

        <div id="stateBadge" class="state starting">starting</div>
        <div id="message" class="msg hidden"></div>

        <div id="choose" class="hidden">
          <label for="dshPath">dsh 可执行文件路径（例如 /opt/homebrew/bin/dsh）</label>
          <input id="dshPath" type="text" placeholder="/opt/homebrew/bin/dsh" />
          <button id="saveBtn">保存并启动</button>
          <div id="cands" class="cands"></div>
        </div>
      </div>
    </div>

    <script>
      // Called by Rust via window.eval whenever the launcher state changes.
      window.__setLauncherState = function (payload) {
        render(payload);
      };

      // 加载态下的默认提示文案
      var LOADING_TEXT = {
        starting: "正在启动本机 dsh web",
        restarting: "正在重启 dsh",
        ready: "即将打开",
      };

      function render(s) {
        if (!s) return;
        var state = s.state || "starting";
        var loading = !(state === "error" || state === "missing-dsh");

        document.getElementById("loader").classList.toggle("hidden", !loading);
        document.getElementById("details").classList.toggle("hidden", loading);

        if (loading) {
          var status = document.getElementById("statusText");
          status.textContent = "";
          // 保留动态省略号节点
          if (s.message) {
            status.textContent = s.message;
          } else {
            status.appendChild(document.createTextNode(LOADING_TEXT[state] || LOADING_TEXT.starting));
            status.appendChild((function () {
              var d = document.createElement("span");
              d.className = "dots";
              return d;
            })());
          }
          return;
        }

        // 详情态（错误 / 未找到 dsh）
        var badge = document.getElementById("stateBadge");
        var msg = document.getElementById("message");
        var choose = document.getElementById("choose");
        var cands = document.getElementById("cands");
        badge.className = "state " + state;
        badge.textContent = state;

        if (s.message) {
          msg.textContent = s.message;
          msg.classList.remove("hidden");
        } else {
          msg.classList.add("hidden");
        }

        if (state === "missing-dsh") {
          choose.classList.remove("hidden");
          if (s.candidates && s.candidates.length) {
            cands.innerHTML =
              "已发现候选：" +
              s.candidates
                .map(function (c) {
                  return "<div><code>" + escapeHtml(c.executable) + "</code> · " + escapeHtml(c.version) + " · " + escapeHtml(c.source) + "</div>";
                })
                .join("");
          } else {
            cands.textContent = "在 PATH 与常见目录中均未发现 dsh。";
          }
        } else {
          choose.classList.add("hidden");
        }
      }

      function escapeHtml(t) {
        return String(t).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }

      async function getStatus() {
        try {
          var invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
          if (!invoke) return;
          var s = await invoke("get_status");
          render(s);
        } catch (e) {
          // Global API may not be ready yet; state will be pushed by Rust anyway.
        }
      }

      document.getElementById("saveBtn").addEventListener("click", async function () {
        var path = document.getElementById("dshPath").value.trim();
        if (!path) return;
        var btn = document.getElementById("saveBtn");
        btn.disabled = true;
        try {
          await window.__TAURI__.core.invoke("select_dsh", { path: path });
        } catch (e) {
          alert("保存失败：" + e);
          btn.disabled = false;
        }
      });

      // Initial fetch + retry until the global API is available.
      (function poll() {
        getStatus();
        if (!(window.__TAURI__ && window.__TAURI__.core)) {
          setTimeout(poll, 300);
        }
      })();
    </script>
  </body>
</html>
