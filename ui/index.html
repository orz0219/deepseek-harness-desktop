<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Harness</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="card">
      <!-- 加载视图 -->
      <div id="loader" class="loader">
        <div class="orb-wrap">
          <span class="halo" aria-hidden="true"></span>
          <span class="ring" aria-hidden="true"></span>
          <span class="orb" aria-hidden="true"></span>
        </div>
        <h1 class="title">DeepSeek Harness</h1>
        <p class="status" id="statusText">正在启动本机 dsh web<span class="dots"></span></p>
        <div class="track" aria-hidden="true"></div>
      </div>

      <!-- 详情视图（错误 / 未找到 dsh 引导） -->
      <div id="details" class="details hidden">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <h1>DeepSeek Harness</h1>
        </div>
        <p class="sub">桌面启动器 · 加载本机 dsh web</p>

        <div id="stateBadge" class="state starting">starting</div>
        <div id="message" class="msg hidden"></div>

        <div id="choose" class="hidden">
          <label for="dshPath">dsh 可执行文件路径（例如 /opt/homebrew/bin/dsh）</label>
          <input id="dshPath" type="text" placeholder="/opt/homebrew/bin/dsh" />
          <label for="port">端口（默认 3080，可选）</label>
          <input id="port" type="text" placeholder="3080" inputmode="numeric" />
          <button id="saveBtn">保存并启动</button>
          <div id="formError" class="form-error"></div>
          <div id="cands" class="cands"></div>
        </div>

        <button id="restartBtn" class="secondary hidden">重新启动</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
