[package]
name = "deepseek-harness-desktop"
version = "0.1.0"
description = "Thin macOS launcher for DeepSeek Harness (dsh web) — locates the user's dsh and serves its Web UI in a native window."
authors = ["DeepSeek Harness Desktop"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

# Pure, Tauri-free core (locator + launch-plan + settings). Unit-tested via
# `cargo test --lib` without pulling the heavy Tauri dependency tree.
[lib]
name = "dsh_launcher"
path = "src/lib.rs"

[[bin]]
name = "deepseek-harness-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[features]
# This feature is used for production builds where `devUrl` is disabled.
custom-protocol = ["tauri/custom-protocol"]
